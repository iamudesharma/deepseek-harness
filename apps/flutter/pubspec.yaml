dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.8.0
  riverpod_lint: ^2.6.5
  custom_lint: ^0.7.0

flutter:
  uses-material-design: true
