name: ci

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: dsh-flutter-build-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-manifest:
    name: manifest + toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml for manifest validation
        run: npm install -g js-yaml
      - name: Validate release.yaml
        run: node scripts/validate-manifest.mjs
      - name: Bootstrap (non-strict)
        run: bash scripts/bootstrap.sh

  flutter-analyze-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Validate manifest
        run: node scripts/validate-manifest.mjs
      - name: Flutter pub get
        run: |
          APP_PATH=$(node -e "const y=require('js-yaml').load(require('fs').readFileSync('release.yaml','utf8')); process.stdout.write(y.app.path)")
          cd "../$APP_PATH" 2>/dev/null || cd "../apps/flutter" 2>/dev/null || cd "$APP_PATH"
          flutter pub get
        working-directory: dsh-flutter-build
      - name: Flutter analyze
        run: |
          APP_PATH=$(node -e "const y=require('js-yaml').load(require('fs').readFileSync('release.yaml','utf8')); process.stdout.write(y.app.path)")
          REPO_ROOT=$(pwd)/..
          flutter analyze "$REPO_ROOT/$APP_PATH"
        working-directory: dsh-flutter-build
      - name: Flutter test
        run: |
          APP_PATH=$(node -e "const y=require('js-yaml').load(require('fs').readFileSync('release.yaml','utf8')); process.stdout.write(y.app.path)")
          REPO_ROOT=$(pwd)/..
          flutter test --reporter=compact "$REPO_ROOT/$APP_PATH"
        working-directory: dsh-flutter-build
      - name: Tracker check (if present)
        run: |
          if [ -f "../scripts/verify-flutter-tracker.ts" ]; then
            npx tsx ../scripts/verify-flutter-tracker.ts
          else
            echo "No tracker script — skipping"
          fi
        working-directory: dsh-flutter-build

  build-web:
    name: web
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build web
        run: bash scripts/build-web.sh
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: artifacts/web/

  build-android:
    name: android (apk + aab)
    runs-on: ubuntu-latest
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build android
        run: bash scripts/build-android.sh
        env:
          DSH_ANDROID_KEYSTORE_BASE64: ${{ secrets.DSH_ANDROID_KEYSTORE_BASE64 }}
          DSH_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DSH_ANDROID_KEYSTORE_PASSWORD }}
          DSH_ANDROID_KEY_ALIAS: ${{ secrets.DSH_ANDROID_KEY_ALIAS }}
          DSH_ANDROID_KEY_PASSWORD: ${{ secrets.DSH_ANDROID_KEY_PASSWORD }}
      - name: Upload android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android/

  build-macos:
    name: macos
    runs-on: macos-14
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build macOS
        run: bash scripts/build-macos.sh
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts/macos/

  build-ios:
    name: ios (unsigned)
    runs-on: macos-14
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build iOS (unsigned)
        run: bash scripts/build-ios.sh
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: artifacts/ios/

  build-linux:
    name: linux
    runs-on: ubuntu-22.04
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build linux
        run: bash scripts/build-linux.sh
      - name: Upload linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: artifacts/linux/

  build-windows:
    name: windows
    runs-on: windows-2022
    needs: validate-manifest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: "stable"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Build windows
        shell: bash
        run: bash scripts/build-windows.sh
      - name: Upload windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: artifacts/windows/

  verify-artifacts:
    name: checksums + release-manifest
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install js-yaml
        run: npm install -g js-yaml
      - name: Generate checksums
        run: bash scripts/checksum.sh generate
      - name: Verify checksums
        run: bash scripts/checksum.sh verify
      - name: Generate release manifest
        run: node scripts/release-manifest.mjs
      - name: Validate manifest
        run: node scripts/release-manifest.mjs --check
      - name: Upload release manifest + checksums
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: |
            artifacts/release-manifest.json
            artifacts/checksums/SHA256SUMS
