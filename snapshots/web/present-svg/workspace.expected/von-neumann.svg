<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" font-family="Helvetica, Arial, sans-serif" viewBox="0 0 900 560"><title>冯诺依曼架构</title><defs><marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3"><path fill="#555" d="M0,0 L8,3 L0,6 Z"/></marker></defs><rect width="900" height="560" x="0" y="0" fill="#fafbfc"/><text x="450" y="34" fill="#222" font-size="22" font-weight="bold" text-anchor="middle">冯诺依曼体系结构 (Von Neumann Architecture)</text><rect width="300" height="240" x="300" y="70" fill="#fff" stroke="#1f6feb" stroke-width="2.5" rx="10"/><text x="450" y="98" fill="#1f6feb" font-size="17" font-weight="bold" text-anchor="middle">中央处理器 CPU</text><rect width="120" height="160" x="325" y="118" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5" rx="8"/><text x="385" y="142" fill="#0969da" font-size="12.5" font-weight="bold" text-anchor="middle">控制单元</text><text x="385" y="158" fill="#0b5394" font-size="11" text-anchor="middle">CU</text><text x="385" y="262" fill="#555" font-size="10" text-anchor="middle">指令译码 · 时序控制</text><rect width="120" height="160" x="455" y="118" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.5" rx="8"/><text x="515" y="142" fill="#9a6700" font-size="12.5" font-weight="bold" text-anchor="middle">算术逻辑单元</text><text x="515" y="158" fill="#7a5200" font-size="11" text-anchor="middle">ALU</text><text x="515" y="262" fill="#555" font-size="10" text-anchor="middle">算术运算 · 逻辑运算</text><rect width="110" height="56" x="330" y="186" fill="#fff" stroke="#8c959f" stroke-dasharray="4 3" stroke-width="1.2" rx="6"/><text x="385" y="208" fill="#444" font-size="11" text-anchor="middle">寄存器组</text><text x="385" y="224" fill="#666" font-size="10" text-anchor="middle">Registers / 缓存</text><rect width="300" height="110" x="300" y="400" fill="#fff" stroke="#cf222e" stroke-width="2.5" rx="10"/><text x="450" y="428" fill="#cf222e" font-size="17" font-weight="bold" text-anchor="middle">内存储器 Memory</text><text x="450" y="452" fill="#444" font-size="12" text-anchor="middle">存储单元: 指令和数据</text><text x="450" y="470" fill="#666" font-size="11" text-anchor="middle">(存放程序与数据，同一总线存取)</text><rect width="170" height="120" x="40" y="150" fill="#fff" stroke="#1a7f37" stroke-width="2.5" rx="10"/><text x="125" y="186" fill="#1a7f37" font-size="15" font-weight="bold" text-anchor="middle">输入设备</text><text x="125" y="206" fill="#444" font-size="11" text-anchor="middle">Input</text><text x="125" y="238" fill="#666" font-size="10" text-anchor="middle">键盘 · 鼠标 · 磁盘</text><rect width="170" height="120" x="690" y="150" fill="#fff" stroke="#bf3989" stroke-width="2.5" rx="10"/><text x="775" y="186" fill="#bf3989" font-size="15" font-weight="bold" text-anchor="middle">输出设备</text><text x="775" y="206" fill="#444" font-size="11" text-anchor="middle">Output</text><text x="775" y="238" fill="#666" font-size="10" text-anchor="middle">显示器 · 打印机</text><path fill="none" stroke="#cf222e" stroke-width="3" d="M450,320 L450,398"/><text x="420" y="362" fill="#cf222e" font-size="11" text-anchor="end" transform="rotate(-90 420 362)">地址总线</text><line x1="300" x2="600" y1="355" y2="355" stroke="#555" stroke-dasharray="2 3" stroke-width="1" opacity="0"/><text x="450" y="353" fill="#555" font-size="12" font-weight="bold" text-anchor="middle">← 数据总线 / 控制总线 →</text><path fill="none" stroke="#1a7f37" stroke-width="3" marker-end="url(#arrow)" d="M212,210 L298,210"/><path fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" d="M212,196 L298,196"/><text x="255" y="184" fill="#1a7f37" font-size="10.5" text-anchor="middle">数据(输入)</text><text x="255" y="236" fill="#555" font-size="10" text-anchor="middle">控制</text><path fill="none" stroke="#bf3989" stroke-width="3" marker-end="url(#arrow)" d="M602,210 L688,210"/><path fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)" d="M602,196 L688,196"/><text x="645" y="184" fill="#bf3989" font-size="10.5" text-anchor="middle">数据(输出)</text><text x="645" y="236" fill="#555" font-size="10" text-anchor="middle">控制</text><path fill="none" stroke="#8c959f" stroke-dasharray="6 4" stroke-width="1.8" marker-end="url(#arrow)" d="M125,272 L125,300 Q125,340 175,340 L298,340"/><text x="160" y="328" fill="#666" font-size="10" text-anchor="middle" transform="rotate(-8 160 328)">总线</text><path fill="none" stroke="#8c959f" stroke-dasharray="6 4" stroke-width="1.8" marker-end="url(#arrow)" d="M775,272 L775,300 Q775,340 725,340 L602,340"/><text x="740" y="328" fill="#666" font-size="10" text-anchor="middle" transform="rotate(8 740 328)">总线</text><text x="450" y="530" fill="#666" font-size="11.5" text-anchor="middle">核心思想: 指令与数据以二进制形式统一存放在存储器中 —— “存储程序”</text></svg>